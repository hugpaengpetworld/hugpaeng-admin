<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUGPAENG ADMIN V2</title>
<style>
:root{
  --cream:#fff8ef;
  --beige:#f3e4cf;
  --sage:#9eb8a6;
  --green:#315f45;
  --deep:#063f2d;
  --brown:#6f5146;
  --gold:#d9931f;
  --white:#ffffff;
  --red:#b00020;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:
    radial-gradient(circle at top left,rgba(255,255,255,.85),transparent 34%),
    linear-gradient(180deg,#fff8ef,#f3e4cf);
  color:var(--deep);
}

.wrap{max-width:960px;margin:auto}

.card{
  background:rgba(255,248,234,.88);
  border-radius:32px;
  padding:22px;
  box-shadow:0 18px 50px rgba(70,50,30,.14);
  border:1px solid rgba(234,220,200,.95);
  backdrop-filter:blur(14px);
}

.admin-topbar{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  margin-bottom:16px;
}

.admin-topbar img{
  width:54px;
  height:54px;
  object-fit:contain;
  border-radius:50%;
}

.admin-brand strong{
  color:var(--green);
  font-size:20px;
  letter-spacing:.5px;
}

.admin-brand small{
  display:block;
  color:var(--gold);
  font-weight:bold;
  margin-top:2px;
}

h1{text-align:center;margin:0;color:var(--deep)}
.sub{text-align:center;color:var(--gold);font-weight:bold;margin:8px 0 18px}

input,select{
  width:100%;
  padding:13px;
  border-radius:14px;
  border:1px solid #eadcc8;
  font-size:16px;
  margin-top:8px;
  background:white;
}

button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:14px;
  margin-top:10px;
  background:var(--gold);
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{filter:brightness(.97)}

.loading,.error,.success{
  padding:14px;
  border-radius:18px;
  margin-top:14px;
  text-align:center;
  font-weight:bold;
}

.loading{background:#eef7f2;color:var(--deep)}
.error{background:#ffe5e5;color:var(--red)}
.success{background:#e8fff0;color:#067a35}

.login-shell{
  max-width:460px;
  margin:18px auto 4px;
  background:rgba(255,255,255,.78);
  border:1px solid #eadcc8;
  border-radius:34px;
  padding:26px;
  box-shadow:0 18px 40px rgba(70,50,30,.12);
}

.login-logo{
  text-align:center;
  margin-bottom:14px;
}

.login-logo img{
  width:94px;
  height:94px;
  object-fit:contain;
  border-radius:50%;
}

.login-title{
  text-align:center;
  color:var(--green);
  font-size:26px;
  font-weight:900;
  margin:0;
}

.login-subtitle{
  text-align:center;
  color:var(--brown);
  margin:8px 0 20px;
  line-height:1.5;
}

.input-group{
  position:relative;
  margin-top:12px;
}

.input-group img{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  width:90px;
  height:90px;
  object-fit:contain;
  pointer-events:none;
}

.input-group input{
  padding-left:120px;
  height:72px;
  border-radius:22px;
  background:#fffdf8;
  border:1px solid #eadcc8;
}

.login-btn{
  height:54px;
  border-radius:20px;
  margin-top:18px;
  background:linear-gradient(135deg,var(--green),#214d36);
  box-shadow:0 10px 20px rgba(49,95,69,.22);
}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:white;border-radius:18px;padding:14px;text-align:center;border:1px solid #f0dfbd}
.stat b{font-size:24px;color:var(--gold)}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tabbar button{background:var(--deep)}
.item{background:white;border-radius:20px;padding:16px;margin-top:14px;border:1px solid #f0dfbd}
.unit{background:#fff8ea;border-radius:14px;padding:12px;margin-top:10px;border:1px dashed var(--gold)}
.row{margin:5px 0}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--deep);color:white;font-weight:bold;font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn-green{background:#0b5a3f}
.btn-red{background:var(--red)}
.btn-gray{background:#666}
.btn-gold{background:var(--gold)}
.hidden{display:none}
.logoutBox{display:grid;grid-template-columns:1fr;gap:8px}
.small{font-size:13px;color:#666;margin-top:6px}

@media(max-width:640px){
  .grid,.tabbar,.actions,.formgrid{grid-template-columns:1fr}
  body{padding:12px}
  .card{padding:16px;border-radius:26px}
  .admin-topbar img{width:46px;height:46px}
  .input-group img{width:74px;height:74px}
  .input-group input{padding-left:100px;height:66px}
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <div class="admin-topbar">
      <img src="logo.png" alt="HUGPAENG Logo">
      <div class="admin-brand">
        <strong>HUGPAENG ADMIN</strong>
        <small>Hotel • Products • UOM • POS</small>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzI4JBgyC74yfJoRhGh068wmxFo6abwmly9IqngiN0_FnXCMTKmVCAodaLdfHq1WufUJQ/exec";

let currentUser = null;
let loginUsername = "";
let loginPassword = "";
let bookings = [];
let products = [];
let currentTab = "hotel";

let sessionTimer = null;
const SESSION_TIMEOUT = 30 * 60 * 1000;

function app(html){ document.getElementById("app").innerHTML = html; }

function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*99999);
    const script = document.createElement("script");
    let finished = false;

    window[cb] = data => {
      finished = true;
      delete window[cb];
      if(script.parentNode) document.body.removeChild(script);
      resolve(data);
    };

    script.onerror = () => {
      if(finished) return;
      finished = true;
      reject(new Error("เชื่อมต่อ API ไม่สำเร็จ"));
    };

    script.src = url + "&callback=" + cb + "&t=" + Date.now();
    document.body.appendChild(script);

    setTimeout(()=>{
      if(!finished){
        finished = true;
        delete window[cb];
        if(script.parentNode) document.body.removeChild(script);
        reject(new Error("API ตอบกลับช้าเกินไป"));
      }
    },15000);
  });
}

function buildUrl(params){
  const q = [];
  for(let key in params){
    q.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key] || ""));
  }
  return API_URL + "?" + q.join("&");
}

function authParams(extra){
  return Object.assign({
    username:loginUsername,
    password:loginPassword
  }, extra || {});
}

function showLogin(){
  clearTimeout(sessionTimer);
  app(`
    <div class="login-shell">
      <div class="login-logo">
        <img src="logo.png" alt="HUGPAENG Logo">
      </div>

      <h1 class="login-title">เข้าสู่ระบบผู้ดูแล</h1>
      <div class="login-subtitle">
        HUGPAENG Admin Dashboard<br>
        จัดการโรงแรม สินค้า และระบบหลังบ้าน
      </div>

      <div class="input-group">
        <img src="Username-logo.png" alt="Username Icon">
        <input id="username" placeholder="Username">
      </div>

      <div class="input-group">
        <img src="Password-logo.png" alt="Password Icon">
        <input id="password" type="password" placeholder="Password">
      </div>

      <button class="login-btn" onclick="login()">เข้าสู่ระบบ</button>
    </div>
  `);

  setTimeout(()=>{
    const u = document.getElementById("username");
    const p = document.getElementById("password");
    if(u) u.addEventListener("keydown", enterLogin);
    if(p) p.addEventListener("keydown", enterLogin);
  },100);
}

function enterLogin(e){
  if(e.key === "Enter") login();
}

async function autoLogin(){
  const savedUsername = localStorage.getItem("admin_username");
  const savedPassword = localStorage.getItem("admin_password");

  if(!savedUsername || !savedPassword){
    showLogin();
    return;
  }

  loginUsername = savedUsername;
  loginPassword = savedPassword;

  app(`<div class="loading">กำลังเข้าสู่ระบบอัตโนมัติ...</div>`);

  try{
    const data = await jsonp(buildUrl({
      action:"adminLogin",
      username:loginUsername,
      password:loginPassword
    }));

    if(data.success){
      currentUser = data.user;
      resetSessionTimer();
      loadDashboard();
      return;
    }

  }catch(err){}

  localStorage.removeItem("admin_username");
  localStorage.removeItem("admin_password");
  showLogin();
}

async function login(){
  loginUsername = document.getElementById("username").value.trim();
  loginPassword = document.getElementById("password").value.trim();

  if(!loginUsername || !loginPassword){
    app(`<div class="error">กรุณากรอก Username และ Password</div>`);
    setTimeout(showLogin,1000);
    return;
  }

  app(`<div class="loading">กำลังเข้าสู่ระบบ...</div>`);

  try{
    const data = await jsonp(buildUrl({
      action:"adminLogin",
      username:loginUsername,
      password:loginPassword
    }));

    if(!data.success){
      app(`<div class="error">${data.error}</div><button onclick="showLogin()">ลองใหม่</button>`);
      return;
    }

    currentUser = data.user;
    localStorage.setItem("admin_username", loginUsername);
    localStorage.setItem("admin_password", loginPassword);
    resetSessionTimer();
    loadDashboard();

  }catch(err){
    app(`<div class="error">${err.message}</div>`);
  }
}

function logout(){
  if(!confirm("ต้องการออกจากระบบใช่หรือไม่?")) return;
  localStorage.removeItem("admin_username");
  localStorage.removeItem("admin_password");
  currentUser = null;
  loginUsername = "";
  loginPassword = "";
  bookings = [];
  products = [];
  currentTab = "hotel";
  clearTimeout(sessionTimer);
  showLogin();
}

function resetSessionTimer(){
  if(!currentUser) return;
  clearTimeout(sessionTimer);
  sessionTimer = setTimeout(()=>{
    alert("ไม่มีการใช้งานเกิน 30 นาที ระบบจะออกจากระบบอัตโนมัติ");
    localStorage.removeItem("admin_username");
    localStorage.removeItem("admin_password");
    currentUser = null;
    loginUsername = "";
    loginPassword = "";
    bookings = [];
    products = [];
    currentTab = "hotel";
    showLogin();
  }, SESSION_TIMEOUT);
}

async function loadDashboard(){
  resetSessionTimer();
  app(`<div class="loading">กำลังโหลด Dashboard...</div>`);

  try{
    const hotelData = await jsonp(buildUrl(authParams({ action:"adminGetHotelBookings" })));
    const productData = await jsonp(buildUrl(authParams({ action:"getProducts" })));

    if(!hotelData.success) throw new Error(hotelData.error);
    if(!productData.success) throw new Error(productData.error);

    bookings = hotelData.bookings || [];
    products = productData.products || [];
    renderDashboard();

  }catch(err){
    app(`<div class="error">${err.message}</div>`);
  }
}

function renderDashboard(){
  resetSessionTimer();

  const pending = bookings.filter(b=>b.statusCode==="PENDING").length;
  const confirmed = bookings.filter(b=>b.statusCode==="CONFIRMED").length;
  const checkin = bookings.filter(b=>b.statusCode==="CHECKIN").length;
  const revenue = bookings
    .filter(b=>b.statusCode!=="CANCELLED")
    .reduce((sum,b)=>sum+(Number(String(b.totalPrice).replace(/,/g,''))||0),0);

  let html = `
    <div class="success logoutBox">
      <div>👤 ${currentUser.name} | ${currentUser.role}</div>
      <button onclick="logout()" class="btn-red">🚪 ออกจากระบบ</button>
    </div>

    <div class="grid">
      <div class="stat">🟡<br>รอยืนยัน<br><b>${pending}</b></div>
      <div class="stat">🟢<br>จองสำเร็จ<br><b>${confirmed}</b></div>
      <div class="stat">🏨<br>เข้าพักอยู่<br><b>${checkin}</b></div>
      <div class="stat">💰<br>รายได้รวม<br><b>${revenue}</b></div>
    </div>

    <div class="tabbar">
      <button onclick="switchTab('hotel')">🏨 โรงแรม</button>
      <button onclick="switchTab('products')">📦 สินค้า</button>
      <button onclick="switchTab('pos')">🛒 POS</button>
    </div>
  `;

  if(currentUser.role === "OWNER"){
    html += `
      <div class="tabbar">
        <button onclick="switchTab('admins')">👥 ผู้ดูแล</button>
        <button onclick="switchTab('settings')">⚙️ ตั้งค่า</button>
        <button onclick="switchTab('reports')">📊 รายงาน</button>
      </div>
    `;
  }

  html += `<div id="content"></div>`;
  app(html);
  renderTab();
}

function switchTab(tab){
  resetSessionTimer();
  currentTab = tab;
  renderTab();
}

function renderTab(){
  resetSessionTimer();
  if(currentTab === "hotel") renderHotel();
  if(currentTab === "products") renderProducts();
  if(currentTab === "pos") renderPOS();
  if(currentTab === "admins") renderAdmins();
  if(currentTab === "settings") renderSettings();
  if(currentTab === "reports") renderReports();
}

function statusIcon(code){
  if(code === "CONFIRMED") return "🟢";
  if(code === "CANCELLED") return "🔴";
  if(code === "CHECKIN") return "🏨";
  if(code === "CHECKOUT") return "✅";
  return "🟡";
}

function renderHotel(){
  const pending = bookings.filter(b=>b.statusCode==="PENDING");
  const active = bookings.filter(b=>b.statusCode==="CONFIRMED" || b.statusCode==="CHECKIN");
  const history = bookings.filter(b=>b.statusCode==="CANCELLED" || b.statusCode==="CHECKOUT");

  let html = `
    <button onclick="loadDashboard()" class="btn-green">รีเฟรช</button>
    <div class="success">🏨 รายการจองโรงแรม</div>
  `;

  html += `<div class="loading">🟡 รอยืนยัน (${pending.length})</div>`;
  pending.forEach(b=>html += bookingCard(b));

  html += `<div class="loading">🏨 กำลังดำเนินการ (${active.length})</div>`;
  active.forEach(b=>html += bookingCard(b));

  html += `<button onclick="toggleHistory()" class="btn-gold">📚 ดู/ซ่อนประวัติ (${history.length})</button>`;
  html += `<div id="historyBox" class="hidden">`;
  history.forEach(b=>html += bookingCard(b));
  html += `</div>`;

  document.getElementById("content").innerHTML = html;
}

function toggleHistory(){
  resetSessionTimer();
  const box = document.getElementById("historyBox");
  box.classList.toggle("hidden");
}

function bookingCard(b){
  const isHistory = b.statusCode==="CANCELLED" || b.statusCode==="CHECKOUT";

  return `
    <div class="item">
      <span class="badge">${statusIcon(b.statusCode)} ${b.status}</span>
      <h3>${b.bookingId}</h3>
      <div class="row"><b>ผู้จอง:</b> ${b.customerName}</div>
      <div class="row"><b>โทร:</b> ${b.phone}</div>
      <div class="row"><b>สัตว์เลี้ยง:</b> ${b.petName}</div>
      <div class="row"><b>ห้อง:</b> ${b.roomType}</div>
      <div class="row"><b>เข้าพัก:</b> ${b.checkIn}</div>
      <div class="row"><b>รับกลับ:</b> ${b.checkOut}</div>
      <div class="row"><b>รวม:</b> ${b.totalPrice} บาท</div>
      <div class="row"><b>หมายเหตุ:</b> ${b.note || "-"}</div>

      ${isHistory ? "" : `
        <div class="actions">
          <button class="btn-green" onclick="updateStatus('${b.bookingId}','CONFIRMED')">ยืนยัน</button>
          <button onclick="updateStatus('${b.bookingId}','CHECKIN')">Check-in</button>
          <button class="btn-gray" onclick="updateStatus('${b.bookingId}','CHECKOUT')">Check-out</button>
          <button class="btn-red" onclick="updateStatus('${b.bookingId}','CANCELLED')">ยกเลิก</button>
        </div>
      `}
    </div>
  `;
}

async function updateStatus(bookingId,statusCode){
  resetSessionTimer();

  const confirmText = {
    CONFIRMED:"ยืนยันการจอง",
    CHECKIN:"เปลี่ยนเป็นเข้าพักอยู่",
    CHECKOUT:"เปลี่ยนเป็นรับกลับแล้ว",
    CANCELLED:"ยกเลิกการจอง"
  };

  if(!confirm(confirmText[statusCode] + " : " + bookingId + " ?")) return;

  app(`<div class="loading">กำลังอัปเดตสถานะ...</div>`);

  try{
    const data = await jsonp(buildUrl(authParams({
      action:"adminUpdateBookingStatus",
      bookingId:bookingId,
      statusCode:statusCode
    })));

    if(data.success){
      await loadDashboard();
    }else{
      app(`<div class="error">${data.error}</div><button onclick="loadDashboard()">กลับไป Dashboard</button>`);
    }

  }catch(err){
    app(`<div class="error">${err.message}</div>`);
  }
}

function renderProducts(){
  let html = `
    <div class="success">📦 Product Management V1 / Multi-Unit UOM</div>

    <div class="item">
      <h3>➕ เพิ่มสินค้าแม่</h3>
      <div class="formgrid">
        <input id="productId" placeholder="ProductID เช่น CAT0001">
        <input id="productName" placeholder="ProductName">
        <input id="category" placeholder="Category เช่น อาหารแมว">
        <input id="brand" placeholder="Brand เช่น Nekko">
        <input id="baseUnit" placeholder="BaseUnit เช่น ชิ้น">
        <input id="cost" type="number" placeholder="Cost ต้นทุน/หน่วยฐาน">
        <input id="stock" type="number" placeholder="Stock หน่วยฐาน">
        <input id="reorderPoint" type="number" placeholder="ReorderPoint จุดสั่งซื้อ">
      </div>
      <button onclick="addProduct()">เพิ่มสินค้าแม่</button>
      <div class="small">สินค้าแม่จะเก็บสต็อกเป็นหน่วยฐาน เช่น ชิ้น</div>
    </div>
  `;

  if(products.length === 0){
    html += `<div class="error">ยังไม่มีสินค้า</div>`;
  }

  products.forEach(p=>{
    const lowStock = Number(p.stock || 0) <= Number(p.reorderPoint || 0);
    html += `
      <div class="item">
        <span class="badge">${p.active}</span>
        ${lowStock ? `<span class="badge" style="background:#b00020;">⚠️ ใกล้หมด</span>` : ``}
        <h3>${p.productId} — ${p.productName}</h3>
        <div class="row"><b>Category:</b> ${p.category || "-"}</div>
        <div class="row"><b>Brand:</b> ${p.brand || "-"}</div>
        <div class="row"><b>BaseUnit:</b> ${p.baseUnit || "-"}</div>
        <div class="row"><b>Cost:</b> ${p.cost || "0"}</div>
        <div class="row"><b>Stock:</b> ${p.stock || "0"} ${p.baseUnit || ""}</div>
        <div class="row"><b>ReorderPoint:</b> ${p.reorderPoint || "0"}</div>

        <button onclick="showAddUnitForm('${p.productId}')" class="btn-green">➕ เพิ่มหน่วยขาย / Barcode</button>
        ${
          currentUser.role === "OWNER"
          ? `<button class="btn-red" onclick="deactivateProduct('${p.productId}')">ปิดการใช้งานสินค้าแม่</button>`
          : ``
        }

        <div id="unitForm_${safeId(p.productId)}" class="hidden"></div>

        <div class="loading">หน่วยขาย / Barcode</div>
        ${renderUnits(p)}
      </div>
    `;
  });

  document.getElementById("content").innerHTML = html;

  ["productId","productName","category","brand","baseUnit","cost","stock","reorderPoint"].forEach(id=>{
    setTimeout(()=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter") addProduct(); });
    },100);
  });
}

function renderUnits(p){
  if(!p.units || p.units.length === 0){
    return `<div class="error">ยังไม่มีหน่วยขาย กรุณาเพิ่ม Barcode อย่างน้อย 1 หน่วย</div>`;
  }

  let html = "";
  p.units.forEach(u=>{
    html += `
      <div class="unit">
        <div><b>Barcode:</b> ${u.barcode}</div>
        <div><b>Unit:</b> ${u.unitName}</div>
        <div><b>Ratio:</b> ${u.ratio} ${p.baseUnit || ""}</div>
        <div><b>Price:</b> ${u.price} บาท</div>
        <div><b>Active:</b> ${u.active}</div>
        ${
          currentUser.role === "OWNER"
          ? `<button class="btn-red" onclick="deactivateProductUnit('${u.barcode}')">ปิดหน่วยขายนี้</button>`
          : ``
        }
      </div>
    `;
  });
  return html;
}

function safeId(value){
  return String(value || '').replace(/[^a-zA-Z0-9ก-๙]/g,'_');
}

function showAddUnitForm(productId){
  resetSessionTimer();
  const box = document.getElementById("unitForm_" + safeId(productId));
  if(!box) return;

  if(!box.classList.contains("hidden")){
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }

  box.classList.remove("hidden");
  box.innerHTML = `
    <div class="unit">
      <h3>➕ เพิ่มหน่วยขายให้ ${productId}</h3>
      <input id="unitBarcode_${safeId(productId)}" placeholder="Barcode">
      <input id="unitName_${safeId(productId)}" placeholder="UnitName เช่น ชิ้น / โหล / ลัง">
      <input id="unitRatio_${safeId(productId)}" type="number" placeholder="Ratio เช่น 1 / 12 / 48">
      <input id="unitPrice_${safeId(productId)}" type="number" placeholder="Price ราคาขาย">
      <button onclick="addProductUnit('${productId}')" class="btn-green">บันทึกหน่วยขาย</button>
    </div>
  `;

  ["unitBarcode_","unitName_","unitRatio_","unitPrice_"].forEach(prefix=>{
    setTimeout(()=>{
      const el = document.getElementById(prefix + safeId(productId));
      if(el) el.addEventListener("keydown", e=>{ if(e.key==="Enter") addProductUnit(productId); });
    },100);
  });
}

async function renderAdmins(){
  resetSessionTimer();

  if(currentUser.role !== "OWNER"){
    document.getElementById("content").innerHTML = `<div class="error">ไม่มีสิทธิ์เข้าถึงเมนูนี้</div>`;
    return;
  }

  try{
    const data = await jsonp(buildUrl(authParams({ action:"getAdminUsers" })));
    if(!data.success) throw new Error(data.error);

    let html = `<div class="success">👥 ผู้ดูแลระบบ</div>`;

    data.admins.forEach(a=>{
      html += `
        <div class="item">
          <h3>${a.name}</h3>
          <div class="row"><b>Username:</b> ${a.username}</div>
          <div class="row"><b>Role:</b> ${a.role}</div>
          <div class="row"><b>Active:</b> ${a.active}</div>
          <div class="row"><b>Last Login:</b> ${a.lastLogin || "-"}</div>
        </div>
      `;
    });

    document.getElementById("content").innerHTML = html;

  }catch(err){
    document.getElementById("content").innerHTML = `<div class="error">${err.message}</div>`;
  }
}
