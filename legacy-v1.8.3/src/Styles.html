<style>
  :root {
    --green-950: #123d32;
    --green-900: #184a3c;
    --green-700: #2f755b;
    --green-500: #55a47d;
    --green-300: #85c9a5;
    --green-100: #dcece3;
    --green-50: #eef7f1;
    --surface: #ffffff;
    --background: #f5f7f4;
    --text: #17352c;
    --muted: #6b7e76;
    --border: #d5e1db;
    --warning: #9a5a05;
    --warning-bg: #fff5d9;
    --danger: #a33a33;
    --danger-bg: #ffefed;
    --shadow: 0 12px 35px rgba(18, 61, 50, 0.09);
    --radius: 18px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--background);
    font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  body.modal-open, body.navigation-open { overflow: hidden; }
  img, svg { max-width: 100%; }
  button, input, select, textarea { font: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible {
    outline: 3px solid rgba(133, 201, 165, .65);
    outline-offset: 2px;
  }
  [hidden] { display: none !important; }
  .visually-hidden {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
  }
  .icon-sprite {
    position: absolute; width: 0; height: 0; overflow: hidden;
  }
  .app-icon {
    width: 20px; height: 20px; display: inline-block; flex: 0 0 auto;
    fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .topbar {
    min-height: 68px;
    background: var(--green-100);
    color: var(--green-950);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 12px max(clamp(18px, 4vw, 56px), env(safe-area-inset-right)) 12px
      max(clamp(18px, 4vw, 56px), env(safe-area-inset-left));
    border-bottom: 1px solid #c8ddd2;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center; flex: 0 0 auto;
    color: #fff; background: var(--green-950); font-size: 22px;
    overflow: hidden;
  }
  .brand-logo-image {
    display: block; width: 100%; height: 100%; object-fit: contain;
    border-radius: inherit; background: #fff;
  }
  .brand strong { display: block; font-size: 1rem; }
  .brand small { display: block; color: var(--green-700); }
  .top-links { display: flex; align-items: center; gap: 8px; }

  .hero {
    background:
      radial-gradient(circle at 84% 15%, rgba(133,201,165,.32), transparent 31%),
      linear-gradient(135deg, #123d32 0%, #1d5948 60%, #2f755b 100%);
    color: #fff;
    padding: clamp(46px, 8vw, 88px) clamp(18px, 7vw, 120px);
  }
  .hero-grid {
    max-width: 1180px; margin: auto;
    display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr);
    gap: clamp(26px, 6vw, 72px); align-items: center;
  }
  .eyebrow {
    margin: 0 0 10px; color: var(--green-300); font-weight: 800;
    letter-spacing: .03em; font-size: .84rem;
  }
  .hero h1 { margin: 0 0 14px; font-size: clamp(2rem, 5vw, 4rem); line-height: 1.12; }
  .hero p { margin: 0 0 24px; color: #e8f4ee; max-width: 680px; font-size: 1.08rem; }
  .hero-card {
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.23);
    border-radius: 24px; padding: 24px; backdrop-filter: blur(8px);
  }
  .hero-card strong { font-size: 1.1rem; }
  .hero-list { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
  .hero-list li { display: flex; gap: 10px; color: #eef8f2; }

  .page-shell { max-width: 1180px; margin: auto; padding: 34px 18px 70px; }
  .section-head { margin-bottom: 22px; }
  .section-head h2 { margin: 0 0 6px; font-size: clamp(1.45rem, 3vw, 2rem); }
  .section-head p { margin: 0; color: var(--muted); }

  .tab-list {
    display: flex; gap: 8px; overflow-x: auto; padding: 5px;
    background: var(--green-100); border-radius: 15px; margin: 0 0 22px;
  }
  .tab {
    border: 0; background: transparent; color: var(--green-950);
    font-weight: 800; padding: 11px 17px; border-radius: 11px; cursor: pointer;
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: #fff; background: var(--green-700); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: clamp(18px, 3vw, 28px);
    box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 18px; }
  .card h2, .card h3 { margin-top: 0; }
  .logo-settings-grid {
    display: grid; grid-template-columns: auto minmax(0, 1fr);
    gap: 20px; align-items: center;
  }
  .clinic-logo-preview {
    width: 104px; height: 104px; padding: 8px;
    display: grid; place-items: center; border-radius: 18px;
    border: 1px solid var(--border); background: var(--green-50);
  }
  .clinic-logo-preview .brand-mark { width: 84px; height: 84px; border-radius: 16px; }
  .form-grid {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 17px;
  }
  .form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .field { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .field.span-2 { grid-column: span 2; }
  label { font-size: .91rem; font-weight: 800; color: var(--green-950); }
  .hint { color: var(--muted); font-size: .82rem; }
  input, select, textarea {
    width: 100%; border: 1px solid #bfcfc7; border-radius: 11px;
    padding: 11px 12px; color: var(--text); background: #fff;
  }
  input:hover, select:hover, textarea:hover { border-color: var(--green-500); }
  textarea { min-height: 92px; resize: vertical; }
  input[type="checkbox"], input[type="radio"] { width: auto; accent-color: var(--green-700); }
  .choice-row { display: flex; gap: 15px; flex-wrap: wrap; padding: 9px 0; }
  .choice { display: flex; align-items: center; gap: 8px; font-weight: 600; }

  .thai-date {
    display: grid; grid-template-columns: .7fr 1.2fr .85fr; gap: 7px;
  }
  .pet-panel {
    border: 1px solid var(--border); background: var(--green-50);
    padding: 18px; border-radius: 15px; margin-top: 14px;
  }
  .pet-panel h4 { margin: 0 0 14px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 1px solid transparent; border-radius: 11px; padding: 11px 18px;
    font-weight: 800; cursor: pointer; text-decoration: none;
    transition: transform .15s, background .15s;
    min-height: 44px;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-primary { color: #fff; background: var(--green-700); }
  .btn-primary:hover { background: var(--green-950); }
  .btn-light { color: var(--green-950); background: #fff; border-color: var(--border); }
  .btn-danger { color: #fff; background: var(--danger); }
  .btn-small { padding: 8px 11px; font-size: .84rem; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 20px; }
  .holiday-add-actions { margin-top: 18px; }
  .holiday-add-form {
    margin-top: 12px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--green-50);
  }
  .holiday-add-form[hidden], .holiday-add-actions [hidden] { display: none; }
  .holiday-list { display: grid; gap: 10px; }
  .holiday-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px; border: 1px solid var(--border); border-radius: 14px; background: #fff;
  }
  .holiday-row small { display: block; margin-top: 4px; color: var(--muted); }
  .holiday-row .actions { margin-top: 0; flex-wrap: wrap; }
  .btn[disabled], button[disabled] { opacity: .55; cursor: wait; transform: none; }

  .notice {
    padding: 13px 15px; border-radius: 12px; margin: 14px 0;
    border: 1px solid var(--border); background: var(--green-50);
  }
  .notice.warning { color: #6f4507; background: var(--warning-bg); border-color: #ecd9a6; }
  .notice.danger { color: var(--danger); background: var(--danger-bg); border-color: #f0c7c3; }
  .notice.success { color: var(--green-950); background: #e3f5e9; border-color: #b7ddc7; }

  .availability {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0;
  }
  .metric {
    border-radius: 14px; background: var(--green-50); padding: 16px;
    border: 1px solid var(--border);
  }
  .metric span { display: block; color: var(--muted); font-size: .84rem; }
  .metric strong { display: block; margin-top: 5px; font-size: 1.5rem; }

  .status {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
    border-radius: 999px; font-size: .78rem; font-weight: 800;
    color: var(--green-950); background: var(--green-100);
  }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green-700); }
  .status.pending { color: #76510f; background: var(--warning-bg); }
  .status.pending::before { background: #bd780a; }
  .status.danger { color: var(--danger); background: var(--danger-bg); }
  .status.danger::before { background: var(--danger); }

  .loading {
    display: inline-block; width: 18px; height: 18px; border: 2px solid currentColor;
    border-right-color: transparent; border-radius: 50%; animation: spin .75s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; right: 20px; bottom: 20px; z-index: 100;
    max-width: min(420px, calc(100vw - 40px)); padding: 14px 18px;
    border-radius: 13px; color: #fff; background: var(--green-950);
    box-shadow: var(--shadow);
  }

  .admin-shell { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
  .sidebar {
    background: var(--green-950); color: #fff; padding: 20px 14px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .sidebar .brand { padding: 4px 6px 22px; border-bottom: 1px solid rgba(255,255,255,.14); }
  .sidebar .brand-mark { background: var(--green-700); }
  .sidebar .brand small { color: #bfe2cf; }
  .sidebar-toggle, .sidebar-close, .sidebar-backdrop { display: none; }
  .nav { display: grid; gap: 6px; margin-top: 18px; }
  .nav-group { display: grid; gap: 4px; }
  .nav button {
    border: 0; color: #fff; background: transparent; text-align: left;
    padding: 12px 13px; border-radius: 11px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-weight: 700;
  }
  .nav button:hover, .nav button.active { background: var(--green-700); }
  .nav-parent { width: 100%; }
  .nav-chevron { margin-left: auto; display: inline-grid; place-items: center; transition: transform .15s; }
  .nav-chevron .app-icon { width: 16px; height: 16px; }
  .nav-group.open .nav-chevron { transform: rotate(180deg); }
  .nav-submenu { display: none; gap: 3px; }
  .nav-group.open .nav-submenu { display: grid; }
  .nav-submenu button { padding-block: 9px; padding-left: 30px; font-size: .9rem; }
  .nav-icon { width: 22px; display: inline-grid; place-items: center; flex: 0 0 22px; }
  .nav-icon .app-icon { width: 20px; height: 20px; color: #fff; }
  .nav-submenu .nav-icon .app-icon { width: 17px; height: 17px; }
  .admin-main { min-width: 0; }
  .admin-top {
    min-height: 68px; display: flex; align-items: center; justify-content: space-between;
    gap: 15px; padding: 12px 24px; background: var(--green-100);
    border-bottom: 1px solid #c8ddd2; color: var(--green-950);
  }
  .admin-title { min-width: 0; flex: 1; }
  .admin-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .admin-user-actions { display: flex; align-items: center; gap: 12px; min-width: 0; }
  #admin-user { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .admin-content { padding: 26px; }
  .section-head-actions, .card-head-actions {
    display: flex; justify-content: space-between; gap: 15px; align-items: flex-end;
  }
  .card-head-actions { align-items: center; }
  .metric-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 16px; margin-bottom: 20px;
  }
  .room-legend {
    display: flex; flex-wrap: wrap; gap: 10px 18px; margin: -8px 0 18px;
    color: var(--green-950); font-size: .86rem;
  }
  .room-legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(18,61,50,.18); }
  .legend-dot.available { background: #C8EAD1; }
  .legend-dot.pending { background: #F7D081; }
  .legend-dot.occupied { background: #FD464A; }
  .legend-dot.unavailable { background: #E2E5E3; }
  .room-date-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 18px;
    margin-bottom: 20px; padding: 16px 18px;
  }
  .room-date-toolbar strong { display: block; font-size: 1.05rem; }
  .room-date-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .room-date-picker { width: 165px; }
  .room-date-picker input { min-height: 40px; padding-block: 7px; }
  .room-card {
    min-height: 176px; transition: transform .15s, box-shadow .15s;
    border: 1px solid var(--border); color: var(--text); text-align: left;
    width: 100%; cursor: pointer; position: relative; font: inherit;
  }
  .room-card + .room-card { margin-top: 0; }
  .room-card:hover { transform: translateY(-2px); }
  .room-card:focus-visible { outline-offset: 3px; }
  .room-card.room-available { background: #C8EAD1; }
  .room-card.room-pending { background: #F7D081; }
  .room-card.room-occupied { background: #FD464A; color: #17352c; }
  .room-card.room-unavailable { background: #E2E5E3; }
  .room-card .hint { color: #315e4e; }
  .room-card.room-occupied .hint { color: #4a2424; }
  .room-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .room-id { display: block; font-size: 1.5rem; margin: 5px 0; }
  .room-species-icon {
    width: 52px; height: 52px; flex: 0 0 52px; border-radius: 16px;
    display: grid; place-items: center; color: #fff; background: rgba(18,61,50,.78);
    box-shadow: 0 6px 15px rgba(18,61,50,.16);
  }
  .room-species-icon .app-icon { width: 34px; height: 34px; stroke-width: 1.8; }
  .room-pet-names { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .room-pet-name {
    display: inline-flex; max-width: 100%; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,.88); color: var(--green-950); font-weight: 800;
    font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .room-booking-code { display: block; margin-top: 10px; font-weight: 700; }
  .status-select { min-width: 175px; padding: 8px 10px; }
  .calendar-card { padding: 20px; }
  .calendar-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; }
  .calendar-weekdays, .calendar-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px;
  }
  .calendar-weekdays span {
    text-align: center; color: var(--muted); font-size: .82rem; font-weight: 800;
    padding: 5px;
  }
  .calendar-day {
    min-height: 98px; border: 1px solid var(--border); border-radius: 12px;
    background: #C8EAD1; color: var(--green-950); padding: 10px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    cursor: pointer; text-align: left;
  }
  .calendar-day:hover { border-color: var(--green-700); transform: translateY(-1px); }
  .calendar-day strong { font-size: 1.08rem; }
  .calendar-day span { font-weight: 800; }
  .calendar-day small { color: #315e4e; }
  .calendar-day.full { background: #FD464A; }
  .calendar-day.full small { color: #4a2424; }
  .calendar-day.holiday { background: #FF8FAB; }
  .calendar-day.holiday small { color: #5D2334; }
  .calendar-day.over-capacity { background: #D7AFF8; color: var(--green-950); }
  .calendar-day.over-capacity small { color: #4A285F; }
  .calendar-pet-link {
    display: block; width: 100%; padding: 3px 5px; border-radius: 6px;
    background: rgba(255,255,255,.75); color: var(--green-950);
    font-size: .72rem; font-weight: 800; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .calendar-pet-link:hover, .calendar-pet-link:focus-visible {
    background: #fff; outline: 2px solid var(--green-700); outline-offset: 1px;
  }
  .calendar-day.muted { background: transparent; border-color: transparent; cursor: default; }
  .data-table-wrap {
    width: 100%; overflow-x: auto; overscroll-behavior-inline: contain;
    -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 14px;
  }
  table { width: 100%; border-collapse: collapse; min-width: 820px; background: #fff; }
  th, td { padding: 12px 13px; text-align: left; border-bottom: 1px solid var(--border); }
  th { color: var(--green-950); background: var(--green-100); font-size: .85rem; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #f8fbf9; }
  .empty { text-align: center; padding: 45px 20px; color: var(--muted); }
  .login-page {
    min-height: 100vh; display: grid; place-items: center;
    padding: 20px; background:
      radial-gradient(circle at 80% 10%, rgba(133,201,165,.42), transparent 30%),
      var(--background);
  }
  .login-card { width: min(440px, 100%); }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 80; background: rgba(7,29,23,.64);
    display: grid; place-items: center; padding: 18px;
  }
  .modal {
    width: min(780px, 100%); max-height: 88vh; overflow-y: auto;
    background: #fff; border-radius: 18px; padding: 23px;
    overscroll-behavior: contain;
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; }
  .modal-head h2 { margin: 0; }
  .icon-btn { border: 0; background: var(--green-100); border-radius: 9px; padding: 7px 10px; cursor: pointer; }
  .icon-btn .app-icon { width: 18px; height: 18px; display: block; }
  #logout-btn .app-icon { width: 17px; height: 17px; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
  .detail-item { border: 1px solid var(--border); border-radius: 11px; padding: 11px; }
  .detail-item span { display: block; color: var(--muted); font-size: .79rem; }
  .operation-species-list {
    width: max-content; max-width: 100%; margin: -10px 0 18px;
    border: 1px solid var(--border); background: #fff;
  }
  .operation-pet-line { display: block; white-space: nowrap; }
  .operation-pet-line + .operation-pet-line { margin-top: 4px; }
  .table-link {
    border: 0; padding: 0; color: var(--green-950); background: transparent;
    font: inherit; font-weight: 800; cursor: pointer; text-decoration: underline;
    text-underline-offset: 3px;
  }
  .booking-room-field label {
    display: block; margin-bottom: 7px; color: var(--muted); font-size: .79rem;
  }
  .booking-room-field select { width: 100%; }
  .booking-room-field small { display: block; margin-top: 6px; color: var(--muted); }

  @media (max-width: 1024px) {
    .hero-grid { grid-template-columns: 1fr; }
    .admin-shell { display: block; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: min(310px, 86vw); height: 100dvh;
      z-index: 90; transform: translateX(-105%); transition: transform .22s ease;
      box-shadow: 18px 0 45px rgba(7,29,23,.22);
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }
    .admin-shell.sidebar-open .sidebar { transform: translateX(0); }
    .sidebar-close {
      display: grid; place-items: center; position: absolute; top: 13px; right: 12px;
      width: 42px; height: 42px; border: 1px solid rgba(255,255,255,.24);
      border-radius: 11px; color: #fff; background: rgba(255,255,255,.1);
      cursor: pointer; z-index: 2;
    }
    .sidebar-close .app-icon { width: 20px; height: 20px; }
    .sidebar .brand { padding-right: 50px; }
    .sidebar-backdrop {
      position: fixed; inset: 0; z-index: 80; border: 0;
      background: rgba(7,29,23,.58); cursor: pointer;
    }
    .admin-shell.sidebar-open .sidebar-backdrop { display: block; }
    .sidebar-toggle {
      display: inline-grid; place-items: center; flex: 0 0 auto;
      width: 44px; height: 44px; border: 1px solid #b9d2c5; border-radius: 11px;
      color: var(--green-950); background: #fff; cursor: pointer; font-size: 1.2rem;
    }
    .sidebar-toggle .app-icon { width: 22px; height: 22px; }
    .admin-top {
      position: sticky; top: 0; z-index: 40;
      padding-left: max(18px, env(safe-area-inset-left));
      padding-right: max(18px, env(safe-area-inset-right));
    }
    .admin-content { padding: 22px 18px 50px; }
    .form-grid.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 700px) {
    .topbar {
